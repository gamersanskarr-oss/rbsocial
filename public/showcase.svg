<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="0.55" stop-color="#101528"/>
      <stop offset="1" stop-color="#200f14"/>
    </linearGradient>
    <radialGradient id="navyGlow" cx="0.18" cy="0.72" r="0.65">
      <stop offset="0" stop-color="#2b3a8f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#2b3a8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameGlow" cx="0.8" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#ff4a36" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff4a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.55" cy="0.45" r="0.4">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3a8f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a2456" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4a36" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#c22a1c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2b3a8f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#0d1120"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#navyGlow)"/>
  <rect width="1600" height="1000" fill="url(#flameGlow)"/>
  <rect width="1600" height="1000" fill="url(#amberGlow)"/>

  <!-- concentric rings, top right -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07">
    <circle cx="1240" cy="210" r="90"/>
    <circle cx="1240" cy="210" r="150"/>
    <circle cx="1240" cy="210" r="215"/>
    <circle cx="1240" cy="210" r="285"/>
  </g>
  <g fill="none" stroke="#ff4a36" stroke-opacity="0.16">
    <circle cx="1240" cy="210" r="120"/>
    <circle cx="1240" cy="210" r="250"/>
  </g>

  <!-- scattered dots -->
  <g fill="#ffffff" fill-opacity="0.22">
    <circle cx="180" cy="150" r="3"/>
    <circle cx="420" cy="90" r="2"/>
    <circle cx="640" cy="200" r="2.5"/>
    <circle cx="980" cy="120" r="2"/>
    <circle cx="1420" cy="420" r="3"/>
    <circle cx="260" cy="520" r="2"/>
    <circle cx="760" cy="330" r="2"/>
    <circle cx="1120" cy="560" r="2.5"/>
  </g>

  <!-- layered waves -->
  <path fill="url(#waveA)" opacity="0.5" d="M0 640 C 220 560 380 720 620 660 C 860 600 1020 740 1260 680 C 1440 636 1540 700 1600 672 L1600 1000 L0 1000 Z"/>
  <path fill="url(#waveB)" opacity="0.55" d="M0 730 C 240 660 420 800 680 740 C 920 686 1080 812 1320 756 C 1470 722 1550 776 1600 752 L1600 1000 L0 1000 Z"/>
  <path fill="url(#waveC)" d="M0 830 C 260 770 460 890 720 840 C 960 794 1140 900 1380 856 C 1500 834 1560 862 1600 850 L1600 1000 L0 1000 Z"/>

  <!-- wordmark -->
  <text x="90" y="880" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="#ffffff" fill-opacity="0.95" letter-spacing="-4">rb</text>
  <text x="252" y="880" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="#ff4a36" letter-spacing="-4">.</text>
  <text x="92" y="930" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.55" letter-spacing="10">SOCIAL BRANDING</text>
</svg>
