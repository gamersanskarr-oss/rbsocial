<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.55" stop-color="#ff4a36"/>
      <stop offset="1" stop-color="#d92c1c"/>
    </linearGradient>
    <linearGradient id="navyWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d2760"/>
      <stop offset="1" stop-color="#3a4bb0"/>
    </linearGradient>
    <radialGradient id="glowFlame" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4a36" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff4a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowNavy" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b3a8f" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#2b3a8f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1600" height="900" fill="#07080d"/>
  <ellipse cx="1280" cy="140" rx="600" ry="340" fill="url(#glowNavy)"/>
  <ellipse cx="240" cy="800" rx="560" ry="320" fill="url(#glowFlame)" opacity="0.7"/>

  <!-- subtle dot patches, edges only -->
  <rect x="70" y="90" width="220" height="150" fill="url(#dots)"/>
  <rect x="1330" y="640" width="220" height="150" fill="url(#dots)"/>

  <!-- minimal wave floor (kept low so the copy zone stays clean) -->
  <path d="M 0 690 C 300 630, 520 740, 820 690 S 1300 610, 1600 680 L 1600 900 L 0 900 Z"
        fill="url(#navyWave)" opacity="0.85"/>
  <path d="M 0 730 C 320 680, 560 790, 860 735 S 1340 660, 1600 720 L 1600 900 L 0 900 Z"
        fill="url(#flame)" opacity="0.9"/>
  <path d="M 0 700 C 300 640, 520 750, 820 700 S 1300 620, 1600 690"
        fill="none" stroke="#ff8a5c" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- growth trend line — digital-marketing motif, left edge -->
  <g transform="translate(150 420)">
    <polyline points="0,140 90,95 165,118 265,40 350,60"
              fill="none" stroke="url(#flame)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 350 60 l -34 4 m 34 -4 l -8 32" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(-6 4) scale(0.9)"/>
    <circle cx="0" cy="140" r="6" fill="#0a0c14" stroke="#ff8a5c" stroke-width="2.5"/>
    <circle cx="90" cy="95" r="6" fill="#0a0c14" stroke="#ff8a5c" stroke-width="2.5"/>
    <circle cx="165" cy="118" r="6" fill="#0a0c14" stroke="#ff8a5c" stroke-width="2.5"/>
    <circle cx="265" cy="40" r="6" fill="#0a0c14" stroke="#ff8a5c" stroke-width="2.5"/>
    <circle cx="350" cy="60" r="8" fill="#ff4a36"/>
  </g>

  <!-- audience targeting rings — right edge -->
  <g transform="translate(1310 300)">
    <circle r="170" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="2 9"/>
    <circle r="115" fill="none" stroke="#4a5cc9" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="60" fill="none" stroke="#ff8a5c" stroke-opacity="0.75" stroke-width="2"/>
    <circle r="9" fill="#ff4a36"/>
    <circle cx="115" cy="0" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="-42" cy="-42" r="4" fill="#ff8a5c" opacity="0.8"/>
  </g>

  <!-- sparse sparkles -->
  <g fill="#ffffff">
    <path d="M 240 150 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6 z" opacity="0.8"/>
    <path d="M 1480 520 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#ffd7a8" opacity="0.8"/>
    <path d="M 1050 120 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.5"/>
  </g>
</svg>
