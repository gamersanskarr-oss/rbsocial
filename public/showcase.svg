<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="0.5" stop-color="#090b14"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </linearGradient>
    <radialGradient id="navyGlow" cx="0.16" cy="0.24" r="0.7">
      <stop offset="0" stop-color="#2b3a8f" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#2b3a8f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2b3a8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameGlow" cx="0.84" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ff4a36" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d92c1c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d92c1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.68" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#4a5cc9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4a5cc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3a8f" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3a4bb0" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#ff4a36" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#ff4a36" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2b3a8f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141b45" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1230" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d92c1c" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#8e2413" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d2760" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e18"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd7a8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#navyGlow)"/>
  <rect width="1600" height="1000" fill="url(#flameGlow)"/>
  <rect width="1600" height="1000" fill="url(#amberGlow)"/>
  <rect width="1600" height="1000" fill="url(#violetGlow)"/>

  <!-- fine concentric arcs, upper right -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06">
    <circle cx="1250" cy="200" r="110"/>
    <circle cx="1250" cy="200" r="185"/>
    <circle cx="1250" cy="200" r="265"/>
    <circle cx="1250" cy="200" r="350"/>
  </g>
  <circle cx="1250" cy="200" r="150" fill="none" stroke="#ff4a36" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="1250" cy="200" r="8" fill="#ff8a5c" opacity="0.9"/>

  <!-- diagonal gradient ribbons -->
  <path d="M -100 520 C 300 400, 560 600, 900 480 S 1400 320, 1720 420"
        fill="none" stroke="url(#ribbonA)" stroke-width="42" stroke-linecap="round" opacity="0.55"/>
  <path d="M -80 560 C 320 460, 600 660, 940 540 S 1420 380, 1700 470"
        fill="none" stroke="url(#ribbonB)" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- scattered light dust -->
  <g fill="#ffffff">
    <circle cx="180" cy="150" r="3" opacity="0.3"/>
    <circle cx="420" cy="90" r="2" opacity="0.22"/>
    <circle cx="640" cy="200" r="2.5" opacity="0.26"/>
    <circle cx="980" cy="120" r="2" opacity="0.2"/>
    <circle cx="1420" cy="420" r="3" opacity="0.24"/>
    <circle cx="260" cy="520" r="2" opacity="0.18"/>
    <circle cx="760" cy="330" r="2" opacity="0.2"/>
    <circle cx="1120" cy="560" r="2.5" opacity="0.22"/>
    <path d="M 330 300 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.5"/>
    <path d="M 1360 620 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#ff8a5c" opacity="0.65"/>
  </g>

  <!-- layered dark waves -->
  <path fill="url(#waveA)" opacity="0.85" d="M0 640 C 220 560 380 720 620 660 C 860 600 1020 740 1260 680 C 1440 636 1540 700 1600 672 L1600 1000 L0 1000 Z"/>
  <path fill="url(#waveB)" opacity="0.6" d="M0 730 C 240 660 420 800 680 740 C 920 686 1080 812 1320 756 C 1470 722 1550 776 1600 752 L1600 1000 L0 1000 Z"/>
  <path fill="url(#waveC)" d="M0 830 C 260 770 460 890 720 840 C 960 794 1140 900 1380 856 C 1500 834 1560 862 1600 850 L1600 1000 L0 1000 Z"/>

  <!-- wordmark -->
  <text x="90" y="880" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="url(#markGrad)" fill-opacity="0.96" letter-spacing="-4">rb</text>
  <text x="252" y="880" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="#ff4a36" letter-spacing="-4">.</text>
  <text x="92" y="930" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.5" letter-spacing="10">SOCIAL BRANDING</text>
</svg>
